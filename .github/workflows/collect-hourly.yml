# Thu thập nguồn nhanh + kiểm tra cảnh báo, mỗi giờ.
# Workflow fail = collector fail — đúng chủ đích "thà thiếu còn hơn sai":
# GitHub sẽ gửi email, đó là kênh báo động khi nguồn dữ liệu vỡ.
name: collect-hourly
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Thu thập nguồn theo giờ
        run: python collect.py coingecko bybit
      - name: Kiểm tra rule cảnh báo
        run: python alerts.py
